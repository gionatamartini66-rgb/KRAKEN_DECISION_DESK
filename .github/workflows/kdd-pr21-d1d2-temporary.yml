name: KDD PR21 D1D2 temporary offline regression
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
jobs:
  d1d2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax and source contract
        run: python -m py_compile decision_desk.py test_decision_desk.py
      - name: D1 D2 new adversarial tests
        run: python -m unittest -v test_decision_desk.PatrimonioD1D2Tests
      - name: Full original KDD + Spot suite
        run: python -m unittest -q test_decision_desk
      - name: Update scripts regression
        run: python -B scripts/test_kdd_aggiorna.py
