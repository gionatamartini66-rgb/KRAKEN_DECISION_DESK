name: KDD G2 Spot mobile + identity final isolated suite
on:
  push:
    branches: [experiments/kdd-any-spot-g2-20261024]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile sources
        run: python -m py_compile decision_desk.py serve.py grafico_4h.py test_decision_desk.py
      - name: Offline regressions, no network or private data
        run: python -m unittest -q test_decision_desk
