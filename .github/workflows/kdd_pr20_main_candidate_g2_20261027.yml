name: KDD main-derived PR20 isolated G2 tests
on:
  push:
    branches: [experiments/kdd-pr20-main-integration-g2-20261027]
permissions:
  contents: read
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Environment
        run: |
          python --version
          node --version
      - name: Canonical offline regression suite
        run: python -B -m unittest -v test_decision_desk
      - name: Existing main updater isolated regression suite
        run: python -B scripts/test_kdd_aggiorna.py
      - name: Integrated homepage plus Spot routes and guarded POST (ephemeral localhost)
        run: |
          python -B - <<'PY'
          import http.client, pathlib, tempfile, threading
          from http.server import ThreadingHTTPServer
          from unittest import mock
          import decision_desk as desk, serve
          original_dir, original_port=desk.DIR,serve.PORT
          with tempfile.TemporaryDirectory(prefix="kdd-main-smoke-") as folder:
              desk.DIR=pathlib.Path(folder)
              (desk.DIR/"cruscotto.html").write_text(
                  "<html><body><h2>1 · Decisioni e posizioni</h2>"
                  "<div>PATRIMONIO_SINTETICO</div><div>PIANO_SINTETICO</div>"
                  "<div>ARCHIVIO_SINTETICO</div></body></html>",encoding="utf-8")
              server=ThreadingHTTPServer(("127.0.0.1",0),serve.Handler)
              serve.PORT=server.server_address[1]
              thread=threading.Thread(target=server.serve_forever,daemon=True)
              thread.start()
              def request(method,path,body=None,host=None):
                  conn=http.client.HTTPConnection("127.0.0.1",serve.PORT,timeout=5)
                  headers={"Host":host or f"127.0.0.1:{serve.PORT}"}
                  if body is not None:headers["Content-Type"]="application/x-www-form-urlencoded"
                  conn.request(method,path,body=body,headers=headers)
                  rsp=conn.getresponse()
                  result=(rsp.status,rsp.read().decode("utf-8"))
                  conn.close()
                  return result
              try:
                  status,page=request("GET","/")
                  assert status==200,(status,page[:100])
                  for marker in ("PATRIMONIO_SINTETICO","PIANO_SINTETICO",
                                 "ARCHIVIO_SINTETICO","href='/mercati/spot'",
                                 "action='/aggiorna'","1 · Decisioni e posizioni"):
                      assert marker in page,("home",marker)
                  assert request("GET","/stato")[0]==200
                  assert request("GET","/",host="bad.invalid")[0]==403
                  with mock.patch.object(serve,"spot_catalog",return_value={}), \
                       mock.patch.object(serve,"spot_selector",return_value="<h1>SELECTOR</h1>"):
                      code,body=request("GET","/mercati/spot")
                      assert code==200 and "SELECTOR" in body,(code,body[:120])
                  with mock.patch.object(serve,"load_spot_chart",return_value="<h1>CHART</h1>"):
                      code,body=request("GET","/grafico/spot?pair=XXBTZEUR&tf=4h")
                      assert code==200 and "CHART" in body,(code,body[:120])
                      assert request("GET","/grafico/spot?pair=XXBTZEUR&tf=invalid")[0]==400
                  with mock.patch.object(serve,"load_spot_comparison",return_value={"synthetic":True}), \
                       mock.patch.object(serve,"render_sui_comparison",return_value="<h1>COMPARE</h1>"):
                      code,body=request("GET","/analisi/spot?pair=XXBTZEUR")
                      assert code==200 and "COMPARE" in body,(code,body[:120])
                  with mock.patch.object(serve,"start_refresh",side_effect=AssertionError("UNEXPECTED REFRESH")):
                      assert request("POST","/aggiorna",body="token=INVALID")[0]==403
                  print("CANDIDATE_UNIFIED_LOCALHOST_HTTP: PASS (synthetic homepage, public routes mocked, no refresh)")
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)
                  serve.PORT=original_port
                  desk.DIR=original_dir
          PY
      - name: Compile exact source files
        run: python -B -m py_compile serve.py grafico_4h.py test_decision_desk.py
