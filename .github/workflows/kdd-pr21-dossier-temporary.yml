name: KDD PR21 Dossier G2 temp offline tests
on:
  push:
    branches: [experiments/kdd-rt-i01-patrimonio-g2-20261028]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -B -m py_compile decision_desk.py dossier_trade.py test_decision_desk.py
      - name: Adversarial E2E RED or GREEN
        run: python -B -m unittest -v test_decision_desk.DossierPatrimonialeG2Tests
      - name: Original full suite
        run: python -B -m unittest -v test_decision_desk
      - name: Updater suite
        run: python -B scripts/test_kdd_aggiorna.py
