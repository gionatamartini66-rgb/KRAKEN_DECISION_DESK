name: KDD candidate checks
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
      - experiments/kdd-android-transaction-g2-20261031
      - experiments/kdd-drive-ui-bridge-g2-20261031
      - experiments/kdd-economic-context-g2-20261102
  pull_request:
    branches:
      - main
      - governance/kdd-29-checklist-gate-20261102
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core KDD regressions
        run: python -B -m unittest -q test_decision_desk
      - name: Private packet, market age and portfolio 4TF synthetic tests
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_android_transaction_g2 test_kdd_economics test_kdd_futures_flow test_kdd_network_defi
      - name: Drive UI handoff through the genuine bridge (no remote API)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_drive_exchange
      - name: Unchanged R5 invariant tests against Android candidate (mapped, no skips)
        run: PYTHONPATH=.:scripts python -B scripts/kdd_android_regressions.py
      - name: Public Kraken order-book funding scenarios (separate from Termux packaging fixture)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_funding_book_g2
      - name: Existing safe updater tests
        run: python -B scripts/test_kdd_aggiorna.py
      - name: TEMP KDD17 new public producer end-to-end live measurement
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
        continue-on-error: true
        timeout-minutes: 4
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json,datetime as dt,time
          import kdd_network_defi as net,kdd_capital_flow as cap
          now=dt.datetime.now(dt.timezone.utc)
          urls=[
            ("OPTUSDC","optimized-asset","optimism","0x0b2c639c533813f4aa9d7837caf62653d097ff85"),
            ("SOL","solana","solana","NATIVE"),
            ("SPLUSDC","usd-coin","solana","EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"),
            ("AVAX","avalanche-2","avalanche","NATIVE"),
            ("BSCUSDT","tether","bsc","0x55d398326f99059ff775485246999027b3197955"),
            ("NEAR","near","near","NATIVE")]
          reports=[]
          for group in (urls[:3],urls[3:]):
              rows=[{"token":token,"progetto_id":proj,
                     "contratti_indicizzati":([] if address=="NATIVE" else
                         [{"rete":chain,"contratto":address}])}
                    for token,proj,chain,address in group]
              native={}
              if any(chain=="avalanche" and address=="NATIVE" for _,_,chain,address in group):
                  native["avalanche"]=net._native_observe("avalanche",net._http,now)
              assets={"posizioni":rows,"candidati":[],"fonti_native":native}
              start=time.monotonic()
              raw=cap.collect(now,assets,{"posizioni":[{} for _ in rows],
                                          "candidati":[]},None,net._http)
              try:
                  read=cap.at_read(raw,assets,{"posizioni":[{} for _ in rows],
                                               "candidati":[]},now)
                  reader="OK"
              except Exception as e:
                  read=None;reader=type(e).__name__+":"+str(e)[:90]
              items=[]
              for i,s in enumerate(raw["sonde"]):
                  events=s.get("eventi") or []
                  first=events[0] if events else None
                  items.append({"token":rows[i]["token"],"chain":s["rete"],
                                "state":s["stato"],"reason":s.get("motivo"),
                                "requests":s["richieste_effettuate"],
                                "events":len(events),"holders":len(s.get("detentori") or []),
                                "aggregate":bool(s.get("aggregato_detentori")),
                                "first":{k:first.get(k) for k in ("tx","quantita","tipo","orario_utc","fonte")}
                                        if first else None,
                                "period":s.get("periodo")})
              reports.append({"items":items,"calls":raw["richieste_effettuate"],
                              "reader":reader,
                              "seconds":round(time.monotonic()-start,3)})
          try:
              security=net._http("https://api.gopluslabs.io/api/v1/token_security/56?contract_addresses=0x55d398326f99059ff775485246999027b3197955")
              entry=security.get("result",{}).get("0x55d398326f99059ff775485246999027b3197955",{})
              reports.append({"goplus":"OK","result_fields":list(entry)[:60] if isinstance(entry,dict) else None,
                              "holders_preview":entry.get("holders",[])[:2] if isinstance(entry,dict) and isinstance(entry.get("holders"),list) else None})
          except Exception as ex:
              reports.append({"goplus":"UNAVAILABLE","reason":type(ex).__name__})
          print("KDD17_REAL_CODE_MEASUREMENT",json.dumps(reports,ensure_ascii=False),flush=True)
          PY

  r5-historical-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc2306fd118024c9bdeb7908d85360c3fc578943
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: R5 ORIGINAL unmodified historical regression suite (NOT Android claims)
        run: |
          python -B -m unittest -q test_decision_desk
          PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_bridge_g2
          python -B scripts/test_kdd_aggiorna.py

  android-transaction-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: G2 Android transaction independent discriminators (Linux synthetic)
        run: PYTHONPATH=.:scripts python -B -m unittest -v scripts.test_kdd_android_transaction_g2

  roadmap-contract:
    name: roadmap-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate all 29 identities and status/checkbox consistency
        run: python -B scripts/check_roadmap_contract.py
      - name: Validate actual PR diff, mandate, evidence and matching roadmap rows
        env:
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KDD_PR_BODY: ${{ github.event.pull_request.body }}
          KDD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B scripts/check_roadmap_contract.py --check-pr
      - name: Positive and adversarial guard tests
        run: python -B -m unittest -q scripts.test_roadmap_contract
