name: KDD candidate checks
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
      - experiments/kdd-android-transaction-g2-20261031
      - experiments/kdd-drive-ui-bridge-g2-20261031
      - experiments/kdd-economic-context-g2-20261102
  pull_request:
    branches:
      - main
      - governance/kdd-29-checklist-gate-20261102
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core KDD regressions
        run: python -B -m unittest -q test_decision_desk
      - name: Private packet, market age and portfolio 4TF synthetic tests
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_android_transaction_g2 test_kdd_economics test_kdd_futures_flow test_kdd_network_defi
      - name: Drive UI handoff through the genuine bridge (no remote API)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_drive_exchange
      - name: Unchanged R5 invariant tests against Android candidate (mapped, no skips)
        run: PYTHONPATH=.:scripts python -B scripts/kdd_android_regressions.py
      - name: Public Kraken order-book funding scenarios (separate from Termux packaging fixture)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_funding_book_g2
      - name: Existing safe updater tests
        run: python -B scripts/test_kdd_aggiorna.py
      - name: TEMP KDD17 public transfer and open index fallback check
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
        continue-on-error: true
        timeout-minutes: 4
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json,time
          import kdd_network_defi as net
          r=[];last_sig=None
          mint="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          bsc="0x55d398326f99059ff775485246999027b3197955"
          contracts={
             "bsc":("https://bsc.blockscout.com",bsc),
             "base":("https://base.blockscout.com","0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"),
             "polygon":("https://polygon.blockscout.com","0x3c499c542cef5e3811e1192ce70d8cc03d5c3359"),
             "arbitrum":("https://arbitrum.blockscout.com","0xaf88d065e77c8cc2239327c5edb3a432268e5831")}
          def run(name,url,payload=None):
              t=time.monotonic()
              try:
                  out=net._http(url,payload)
                  if payload and (not isinstance(out,dict) or out.get("error") or "result" not in out):
                      raise ValueError(str(out.get("error") if isinstance(out,dict) else out)[:110])
                  obj=out["result"] if payload else out
                  items=(obj.get("items") or obj.get("value")) if isinstance(obj,dict) else obj
                  first=items[0] if isinstance(items,list) and items else None
                  rec={"name":name,"status":"OK","ms":round(1000*(time.monotonic()-t)),
                       "keys":list(obj)[:12] if isinstance(obj,dict) else None,
                       "n":len(items) if isinstance(items,list) else None,
                       "firstkeys":list(first)[:20] if isinstance(first,dict) else None}
                  r.append(rec);return obj
              except Exception as ex:
                  r.append({"name":name,"status":"FAIL","ms":round(1000*(time.monotonic()-t)),
                           "reason":type(ex).__name__+":"+str(getattr(ex,"code",str(ex)))[:115]});return None
          for chain,(url,addr) in contracts.items():
              for suffix in ("/transfers","/holders"):
                  run(chain+suffix,url+"/api/v2/tokens/"+addr+suffix)
          url="https://public.rpc.solanavibestation.com"
          def rpc(name,method,params):
              return run(name,url,{"jsonrpc":"2.0","id":1,"method":method,"params":params})
          sigs=rpc("sol_sig_mint","getSignaturesForAddress",[mint,{"limit":1,"commitment":"finalized"}])
          if isinstance(sigs,list) and sigs:
              tx=rpc("sol_tx_mint","getTransaction",[sigs[0]["signature"],{
                   "encoding":"jsonParsed","commitment":"finalized","maxSupportedTransactionVersion":0}])
              if isinstance(tx,dict):
                  msg=(tx.get("transaction") or {}).get("message") or {}
                  parsed=[a.get("parsed") for a in msg.get("instructions",[])
                          if isinstance(a,dict) and isinstance(a.get("parsed"),dict)]
                  r.append({"name":"sol_tx_mint_parsed","status":"LOCAL","slot":tx.get("slot"),
                            "parsedtypes":[p.get("type") for p in parsed[:8]],
                            "mint_checked":any(p.get("info",{}).get("mint")==mint for p in parsed)})
          rpc("sol_largest_nometa","getLargestAccounts",[{"commitment":"finalized"}])
          rpc("sol_supply","getTokenSupply",[mint,{"commitment":"finalized"}])
          rpc("sol_largest_spl","getTokenLargestAccounts",[mint,{"commitment":"finalized"}])
          # Native AVAX EVM RPC method checks, read-only.
          ava="https://api.avax.network/ext/bc/C/rpc"
          run("avalanche_eth_blockNumber",ava,{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]})
          run("avalanche_block",ava,{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["latest",False]})
          print("KDD17_LIVE_ALTS_2",json.dumps(r),flush=True)
          PY

  r5-historical-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc2306fd118024c9bdeb7908d85360c3fc578943
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: R5 ORIGINAL unmodified historical regression suite (NOT Android claims)
        run: |
          python -B -m unittest -q test_decision_desk
          PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_bridge_g2
          python -B scripts/test_kdd_aggiorna.py

  android-transaction-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: G2 Android transaction independent discriminators (Linux synthetic)
        run: PYTHONPATH=.:scripts python -B -m unittest -v scripts.test_kdd_android_transaction_g2

  roadmap-contract:
    name: roadmap-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate all 29 identities and status/checkbox consistency
        run: python -B scripts/check_roadmap_contract.py
      - name: Validate actual PR diff, mandate, evidence and matching roadmap rows
        env:
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KDD_PR_BODY: ${{ github.event.pull_request.body }}
          KDD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B scripts/check_roadmap_contract.py --check-pr
      - name: Positive and adversarial guard tests
        run: python -B -m unittest -q scripts.test_roadmap_contract
