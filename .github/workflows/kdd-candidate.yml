name: KDD candidate checks
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
      - experiments/kdd-android-transaction-g2-20261031
      - experiments/kdd-drive-ui-bridge-g2-20261031
      - experiments/kdd-economic-context-g2-20261102
  pull_request:
    branches:
      - main
      - governance/kdd-29-checklist-gate-20261102
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core KDD regressions
        run: python -B -m unittest -q test_decision_desk
      - name: Private packet, market age and portfolio 4TF synthetic tests
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_android_transaction_g2 test_kdd_economics test_kdd_futures_flow test_kdd_network_defi
      - name: Drive UI handoff through the genuine bridge (no remote API)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_drive_exchange
      - name: Unchanged R5 invariant tests against Android candidate (mapped, no skips)
        run: PYTHONPATH=.:scripts python -B scripts/kdd_android_regressions.py
      - name: Public Kraken order-book funding scenarios (separate from Termux packaging fixture)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_funding_book_g2
      - name: Existing safe updater tests
        run: python -B scripts/test_kdd_aggiorna.py
      - name: TEMP KDD17 bounded public provider discovery on PR64
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
        continue-on-error: true
        timeout-minutes: 4
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json,time,datetime as dt,urllib.parse
          import kdd_network_defi as net
          contract={
              "polygon":("137","0x3c499c542cef5e3811e1192ce70d8cc03d5c3359"),
              "base":("8453","0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"),
              "arbitrum":("42161","0xaf88d065e77c8cc2239327c5edb3a432268e5831"),
              "optimism":("10","0x0b2c639c533813f4aa9d7837caf62653d097ff85")}
          results=[];max_calls=24
          def check(name,url,payload=None):
              if len(results)>=max_calls:return
              t=time.monotonic()
              try:
                  out=net._http(url,payload)
                  result=out.get("result") if payload and isinstance(out,dict) else out
                  if payload and (not isinstance(out,dict) or out.get("error") or "result" not in out):
                      raise ValueError("RPC error "+str(out.get("error") if isinstance(out,dict) else out)[:100])
                  rows=(result.get("items") or result.get("operations") or result.get("holders") or result.get("value")
                        if isinstance(result,dict) else result)
                  if not isinstance(rows,list):rows=None
                  first=rows[0] if rows else None
                  results.append({"name":name,"status":"OK","ms":round((time.monotonic()-t)*1000),
                      "keys":list(result)[:12] if isinstance(result,dict) else None,
                      "n":len(rows) if rows is not None else None,
                      "firstkeys":list(first)[:20] if isinstance(first,dict) else None,
                      "sample":{k:first.get(k) for k in ("txHash","tokenAddress","chainId","amount","tokenDecimals","timestamp","balance")}
                                if isinstance(first,dict) else None})
              except Exception as ex:
                  results.append({"name":name,"status":"FAIL","ms":round((time.monotonic()-t)*1000),
                                  "err":type(ex).__name__+":"+str(getattr(ex,"code",str(ex)))[:90]})
          for label,(chainid,address) in contract.items():
              base="https://api.routescan.io/v2/network/mainnet/evm/"+chainid
              check(label+"_erc20",base+"/erc20-transfers?tokenAddress="+address+"&sort=desc&limit=5")
              check(label+"_holders",base+"/erc20/"+address+"/holders?limit=5")
          for label,url,method,params in [
            ("sol_vibe_largest","https://public.rpc.solanavibestation.com","getTokenLargestAccounts",["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",{"commitment":"finalized"}]),
            ("sol_vibe_sig","https://public.rpc.solanavibestation.com","getSignaturesForAddress",["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",{"limit":1}]),
            ("sol_chainstack","https://solana-mainnet.rpc.chainstack.com","getTokenLargestAccounts",["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",{"commitment":"finalized"}]),
            ("sol_vibe_sollargest","https://public.rpc.solanavibestation.com","getLargestAccounts",[{"commitment":"finalized","filter":"circulating"}]),
            ("bsc_bscscan_rpc","https://bsc-dataseed.bnbchain.org","eth_getLogs",[{"address":"0x55d398326f99059ff775485246999027b3197955","fromBlock":"latest","toBlock":"latest","topics":["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"]}]),
            ("bsc_alt_rpc","https://bsc.publicnode.com","eth_blockNumber",[]),
          ]:
              check(label,url,{"jsonrpc":"2.0","id":1,"method":method,"params":params})
          for label,url in [
             ("xrpscan_labels","https://api.xrpscan.com/api/v1/names/well-known"),
             ("xrpscan_rich","https://api.xrpscan.com/api/v1/balances"),
             ("binplorer_holder","https://api.binplorer.com/getTopTokenHolders/0x55d398326f99059ff775485246999027b3197955?apiKey=freekey&limit=5"),
             ("solanafm_info","https://api.solana.fm/v0/tokens/EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"),
          ]:check(label,url)
          print("KDD17_PROVIDER_DISCOVERY",json.dumps({"count":len(results),"items":results},ensure_ascii=False),flush=True)
          PY

  r5-historical-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc2306fd118024c9bdeb7908d85360c3fc578943
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: R5 ORIGINAL unmodified historical regression suite (NOT Android claims)
        run: |
          python -B -m unittest -q test_decision_desk
          PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_bridge_g2
          python -B scripts/test_kdd_aggiorna.py

  android-transaction-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: G2 Android transaction independent discriminators (Linux synthetic)
        run: PYTHONPATH=.:scripts python -B -m unittest -v scripts.test_kdd_android_transaction_g2

  roadmap-contract:
    name: roadmap-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate all 29 identities and status/checkbox consistency
        run: python -B scripts/check_roadmap_contract.py
      - name: Validate actual PR diff, mandate, evidence and matching roadmap rows
        env:
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KDD_PR_BODY: ${{ github.event.pull_request.body }}
          KDD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B scripts/check_roadmap_contract.py --check-pr
      - name: Positive and adversarial guard tests
        run: python -B -m unittest -q scripts.test_roadmap_contract
