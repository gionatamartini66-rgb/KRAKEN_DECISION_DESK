name: KDD candidate checks
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
      - experiments/kdd-android-transaction-g2-20261031
      - experiments/kdd-drive-ui-bridge-g2-20261031
      - experiments/kdd-economic-context-g2-20261102
  pull_request:
    branches:
      - main
      - governance/kdd-29-checklist-gate-20261102
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core KDD regressions
        run: python -B -m unittest -q test_decision_desk
      - name: Private packet, market age and portfolio 4TF synthetic tests
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_android_transaction_g2 test_kdd_economics test_kdd_futures_flow test_kdd_network_defi
      - name: Drive UI handoff through the genuine bridge (no remote API)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_drive_exchange
      - name: Unchanged R5 invariant tests against Android candidate (mapped, no skips)
        run: PYTHONPATH=.:scripts python -B scripts/kdd_android_regressions.py
      - name: Public Kraken order-book funding scenarios (separate from Termux packaging fixture)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_funding_book_g2
      - name: Existing safe updater tests
        run: python -B scripts/test_kdd_aggiorna.py
      - name: TEMP KDD17 public Routescan multichain and Kraken Spot schema verification
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json,urllib.request,urllib.parse,time
          import kdd_network_defi as net
          todo=[
           ("routescan_eth_usdc_transfers","https://api.routescan.io/v2/network/mainnet/evm/1/erc20-transfers?tokenAddress=0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48&sort=desc&limit=5"),
           ("routescan_eth_usdc_holders","https://api.routescan.io/v2/network/mainnet/evm/1/erc20/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48/holders?limit=5"),
           ("routescan_bsc_usdt_transfers","https://api.routescan.io/v2/network/mainnet/evm/56/erc20-transfers?tokenAddress=0x55d398326f99059ff775485246999027b3197955&sort=desc&limit=5"),
           ("routescan_avalanche_usdc_transfers","https://api.routescan.io/v2/network/mainnet/evm/43114/erc20-transfers?tokenAddress=0xB97EF9Ef8734C71904D8002F8b6Bc66Dd9c48a6E&sort=desc&limit=5"),
           ("routescan_base_usdc_transfers","https://api.routescan.io/v2/network/mainnet/evm/8453/erc20-transfers?tokenAddress=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&sort=desc&limit=5"),
           ("routescan_arbitrum_usdc_transfers","https://api.routescan.io/v2/network/mainnet/evm/42161/erc20-transfers?tokenAddress=0xaf88d065e77c8cc2239327c5edb3a432268e5831&sort=desc&limit=5"),
           ("kraken_assetpairs","https://api.kraken.com/0/public/AssetPairs?pair=AAVEEUR%2CBONKEUR%2CLINKEUR%2CAVAXEUR%2CUNIEUR%2CUSDCEUR"),
          ]
          rec=[]
          for name,url in todo:
              t=time.monotonic()
              try:
                  data=net._http(url)
                  items=data.get("items") if isinstance(data,dict) else None
                  kr=data.get("result") if isinstance(data,dict) else None
                  item=items[0] if isinstance(items,list) and items else None
                  rec.append({"name":name,"status":"OK","elapsed_ms":round((time.monotonic()-t)*1000),
                              "top_keys":list(data)[:12] if isinstance(data,dict) else None,
                              "count":len(items) if isinstance(items,list) else None,
                              "first_keys":list(item)[:18] if isinstance(item,dict) else None,
                              "first_value":{k:item.get(k) for k in ("txHash","tokenAddress","tokenDecimals","amount","chainId","timestamp")}
                                  if isinstance(item,dict) else None,
                              "kraken_keys":list(kr)[:15] if isinstance(kr,dict) else None,
                              "kraken_errors":data.get("error") if isinstance(data,dict) and name.startswith("kraken_") else None})
              except Exception as e:
                  rec.append({"name":name,"status":"UNAVAILABLE","elapsed_ms":round((time.monotonic()-t)*1000),
                              "error":type(e).__name__+":"+str(getattr(e,"code",str(e)))[:110]})
          print("KDD17_ROUTES_SPOT_LIVE",json.dumps(rec),flush=True)
          PY

  r5-historical-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc2306fd118024c9bdeb7908d85360c3fc578943
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: R5 ORIGINAL unmodified historical regression suite (NOT Android claims)
        run: |
          python -B -m unittest -q test_decision_desk
          PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_bridge_g2
          python -B scripts/test_kdd_aggiorna.py

  android-transaction-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: G2 Android transaction independent discriminators (Linux synthetic)
        run: PYTHONPATH=.:scripts python -B -m unittest -v scripts.test_kdd_android_transaction_g2

  roadmap-contract:
    name: roadmap-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate all 29 identities and status/checkbox consistency
        run: python -B scripts/check_roadmap_contract.py
      - name: Validate actual PR diff, mandate, evidence and matching roadmap rows
        env:
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KDD_PR_BODY: ${{ github.event.pull_request.body }}
          KDD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B scripts/check_roadmap_contract.py --check-pr
      - name: Positive and adversarial guard tests
        run: python -B -m unittest -q scripts.test_roadmap_contract
