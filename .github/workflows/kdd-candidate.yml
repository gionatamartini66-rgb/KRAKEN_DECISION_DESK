name: KDD candidate checks
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
      - experiments/kdd-android-transaction-g2-20261031
      - experiments/kdd-drive-ui-bridge-g2-20261031
      - experiments/kdd-economic-context-g2-20261102
  pull_request:
    branches:
      - main
      - governance/kdd-29-checklist-gate-20261102
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core KDD regressions
        run: python -B -m unittest -q test_decision_desk
      - name: Private packet, market age and portfolio 4TF synthetic tests
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_android_transaction_g2 test_kdd_economics test_kdd_futures_flow test_kdd_network_defi
      - name: Drive UI handoff through the genuine bridge (no remote API)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_drive_exchange
      - name: Unchanged R5 invariant tests against Android candidate (mapped, no skips)
        run: PYTHONPATH=.:scripts python -B scripts/kdd_android_regressions.py
      - name: Public Kraken order-book funding scenarios (separate from Termux packaging fixture)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_funding_book_g2
      - name: Existing safe updater tests
        run: python -B scripts/test_kdd_aggiorna.py
      - name: TEMP KDD17 multichain EVM RPC and native SOL public proof
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
        continue-on-error: true
        timeout-minutes: 4
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json,time
          import kdd_network_defi as net,kdd_capital_flow as cap
          findings=[]
          def probe(name,url,method,params):
              t=time.monotonic()
              try:
                  r=net._http(url,{"jsonrpc":"2.0","id":1,"method":method,"params":params})
                  if not isinstance(r,dict) or r.get("error") or "result" not in r:
                      raise ValueError(str(r.get("error") if isinstance(r,dict) else r)[:90])
                  obj=r["result"]
                  info={"name":name,"status":"OK","ms":round(1000*(time.monotonic()-t)),
                        "count":len(obj) if isinstance(obj,list) else None,
                        "shape":list(obj)[:14] if isinstance(obj,dict) else type(obj).__name__}
                  if isinstance(obj,list) and obj and isinstance(obj[0],dict):
                      info["first_keys"]=list(obj[0])[:14]
                  findings.append(info);return obj
              except Exception as e:
                  findings.append({"name":name,"status":"FAIL","ms":round(1000*(time.monotonic()-t)),
                                   "reason":type(e).__name__+":"+str(getattr(e,"code",str(e)))[:110]})
                  return None
          configs=[
            ("base","https://mainnet.base.org","0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"),
            ("arbitrum","https://arb1.arbitrum.io/rpc","0xaf88d065e77c8cc2239327c5edb3a432268e5831"),
            ("optimism","https://mainnet.optimism.io","0x0b2c639c533813f4aa9d7837caf62653d097ff85"),
            ("polygon","https://polygon-rpc.com","0x3c499c542cef5e3811e1192ce70d8cc03d5c3359")]
          for label,url,token in configs:
              height=probe(label+"_height",url,"eth_blockNumber",[])
              if isinstance(height,str):
                  try:
                      n=int(height,16)
                      probe(label+"_logs",url,"eth_getLogs",[{
                          "address":token,"fromBlock":hex(n-10),"toBlock":hex(n-5),
                          "topics":[cap.TOPIC_TRANSFER]}])
                  except (ValueError,OverflowError):pass
          s="https://public.rpc.solanavibestation.com"
          sig=probe("sol_native_system_signatures",s,"getSignaturesForAddress",
                    ["11111111111111111111111111111111",{"limit":1,"commitment":"finalized"}])
          if isinstance(sig,list) and sig:
              tx=probe("sol_native_v1_tx",s,"getTransaction",
                   [sig[0]["signature"],{"encoding":"jsonParsed","commitment":"finalized",
                                          "maxSupportedTransactionVersion":1}])
              if isinstance(tx,dict):
                  msg=(tx.get("transaction") or {}).get("message") or {}
                  instructions=list(msg.get("instructions") or [])
                  for item in (tx.get("meta") or {}).get("innerInstructions") or []:
                      instructions.extend(item.get("instructions") or [])
                  types=[x.get("parsed",{}).get("type") for x in instructions
                         if isinstance(x,dict) and isinstance(x.get("parsed"),dict)]
                  findings.append({"name":"sol_system_sample","status":"OBSERVED",
                                   "system_transfer_count":types.count("transfer"),
                                   "all_parsed":types[:20]})
          for label,url in [
              ("xrpl_analytics_rich","https://xrplanalytics.com/api/richlist?limit=10"),
              ("xrpl_to_rich","https://api.xrpl.to/api/richlist?limit=10"),
              ("goplus_bsc","https://api.gopluslabs.io/api/v1/token_security/56?contract_addresses=0x55d398326f99059ff775485246999027b3197955")]:
              t=time.monotonic()
              try:
                  obj=net._http(url)
                  findings.append({"name":label,"status":"OK","ms":round(1000*(time.monotonic()-t)),
                    "keys":list(obj)[:12] if isinstance(obj,dict) else None})
              except Exception as e:
                  findings.append({"name":label,"status":"FAIL","ms":round(1000*(time.monotonic()-t)),
                     "reason":type(e).__name__+":"+str(getattr(e,"code",str(e)))[:100]})
          print("KDD17_EVM_SOL_NATIVE4",json.dumps(findings),flush=True)
          PY

  r5-historical-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc2306fd118024c9bdeb7908d85360c3fc578943
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: R5 ORIGINAL unmodified historical regression suite (NOT Android claims)
        run: |
          python -B -m unittest -q test_decision_desk
          PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_bridge_g2
          python -B scripts/test_kdd_aggiorna.py

  android-transaction-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: G2 Android transaction independent discriminators (Linux synthetic)
        run: PYTHONPATH=.:scripts python -B -m unittest -v scripts.test_kdd_android_transaction_g2

  roadmap-contract:
    name: roadmap-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate all 29 identities and status/checkbox consistency
        run: python -B scripts/check_roadmap_contract.py
      - name: Validate actual PR diff, mandate, evidence and matching roadmap rows
        env:
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KDD_PR_BODY: ${{ github.event.pull_request.body }}
          KDD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B scripts/check_roadmap_contract.py --check-pr
      - name: Positive and adversarial guard tests
        run: python -B -m unittest -q scripts.test_roadmap_contract
