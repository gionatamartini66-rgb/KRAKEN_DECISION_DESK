name: KDD candidate checks
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
      - experiments/kdd-android-transaction-g2-20261031
      - experiments/kdd-drive-ui-bridge-g2-20261031
      - experiments/kdd-economic-context-g2-20261102
  pull_request:
    branches:
      - main
      - governance/kdd-29-checklist-gate-20261102
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core KDD regressions
        run: python -B -m unittest -q test_decision_desk
      - name: Private packet, market age and portfolio 4TF synthetic tests
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_android_transaction_g2 test_kdd_economics test_kdd_futures_flow test_kdd_network_defi
      - name: Drive UI handoff through the genuine bridge (no remote API)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_drive_exchange
      - name: Unchanged R5 invariant tests against Android candidate (mapped, no skips)
        run: PYTHONPATH=.:scripts python -B scripts/kdd_android_regressions.py
      - name: Public Kraken order-book funding scenarios (separate from Termux packaging fixture)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_funding_book_g2
      - name: Existing safe updater tests
        run: python -B scripts/test_kdd_aggiorna.py
      - name: TEMP KDD17 corrected bound producer and GoPlus live evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
        continue-on-error: true
        timeout-minutes: 4
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json,datetime as dt,time
          import kdd_network_defi as net,kdd_capital_flow as cap
          now=dt.datetime.now(dt.timezone.utc)
          known=[
             ("OPTUSDC","optimism","0x0b2c639c533813f4aa9d7837caf62653d097ff85"),
             ("SOL","solana","NATIVE"),
             ("SOL_USDC","solana","EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"),
             ("AVAX","avalanche","NATIVE"),
             ("BSC_USDT","bsc","0x55d398326f99059ff775485246999027b3197955"),
             ("NEAR","near","NATIVE")]
          groups=[known[:3],known[3:]]
          out=[]
          for group in groups:
              positions=[{"token":sym,"progetto_id":sym.lower(),
                          "contratti_indicizzati":([] if identifier=="NATIVE"
                                  else [{"rete":chain,"contratto":identifier}])}
                         for sym,chain,identifier in group]
              native={}
              if any(chain=="avalanche" and identifier=="NATIVE" for _,chain,identifier in group):
                  native["avalanche"]=net._native_observe("avalanche",net._http,now)
              data={"posizioni":positions,"candidati":[],"fonti_native":native}
              mapping={(chain,identifier):sym for sym,chain,identifier in group}
              # SOL must bind to its true canonical project id for native routing.
              for row in positions:
                  if row["token"]=="SOL":row["progetto_id"]="solana"
                  if row["token"]=="AVAX":row["progetto_id"]="avalanche-2"
                  if row["token"]=="NEAR":row["progetto_id"]="near"
              t=time.monotonic()
              raw=cap.collect(now,data,{"posizioni":[{}]*len(positions),
                                        "candidati":[]},None,net._http)
              try:
                  view=cap.at_read(raw,data,{"posizioni":[{}]*len(positions),
                                            "candidati":[]},now)
                  viewed={p["token"]:p["osservazioni"] for p in view["posizioni"]}
                  reader="PASS"
              except Exception as exc:
                  reader=type(exc).__name__+":"+str(exc)[:100]
                  viewed={}
              samples=[]
              for s in raw["sonde"]:
                  key=(s["rete"],s["asset_tecnico"])
                  ev=(s.get("eventi") or [])
                  first=ev[0] if ev else None
                  sym=mapping.get(key,"UNKNOWN")
                  samples.append({"asset":sym,"network":s["rete"],"state":s["stato"],
                       "reason":s.get("motivo"),"requests":s["richieste_effettuate"],
                       "events":len(ev),"holders":len(s.get("detentori") or []),
                       "holder_aggregate":bool(s.get("aggregato_detentori")),
                       "reader_state":viewed.get(sym,[{}])[0].get("stato") if viewed.get(sym) else None,
                       "first":{k:first.get(k) for k in ("tx","quantita","tipo","orario_utc","fonte")}
                               if first else None,"period":s.get("periodo")})
              out.append({"samples":samples,"requests":raw["richieste_effettuate"],
                          "seconds":round(time.monotonic()-t,3),"reader":reader})
          bsc="0x55d398326f99059ff775485246999027b3197955"
          t=time.monotonic()
          try:
              fallback=cap._bsc_goplus_holders(bsc,net._http,{})
              out.append({"goplus_fallback":"PASS",
                  "holders":len(fallback["detentori"]),
                  "holder_count":fallback["aggregato_detentori"]["numero_account"],
                  "first_raw":fallback["detentori"][0]["unita_minima"] if fallback["detentori"] else None,
                  "labelled":sum(1 for h in fallback["detentori"]
                               if h["entita"]["stato"]=="ETICHETTA_PUBBLICA"),
                  "seconds":round(time.monotonic()-t,3)})
          except Exception as ex:
              out.append({"goplus_fallback":"UNAVAILABLE","reason":type(ex).__name__+":"+str(ex)[:100],
                          "seconds":round(time.monotonic()-t,3)})
          print("KDD17_FINAL_LIVE_PRODUCERS",json.dumps(out,ensure_ascii=False),flush=True)
          PY

  r5-historical-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc2306fd118024c9bdeb7908d85360c3fc578943
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: R5 ORIGINAL unmodified historical regression suite (NOT Android claims)
        run: |
          python -B -m unittest -q test_decision_desk
          PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_bridge_g2
          python -B scripts/test_kdd_aggiorna.py

  android-transaction-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: G2 Android transaction independent discriminators (Linux synthetic)
        run: PYTHONPATH=.:scripts python -B -m unittest -v scripts.test_kdd_android_transaction_g2

  roadmap-contract:
    name: roadmap-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate all 29 identities and status/checkbox consistency
        run: python -B scripts/check_roadmap_contract.py
      - name: Validate actual PR diff, mandate, evidence and matching roadmap rows
        env:
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KDD_PR_BODY: ${{ github.event.pull_request.body }}
          KDD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B scripts/check_roadmap_contract.py --check-pr
      - name: Positive and adversarial guard tests
        run: python -B -m unittest -q scripts.test_roadmap_contract
