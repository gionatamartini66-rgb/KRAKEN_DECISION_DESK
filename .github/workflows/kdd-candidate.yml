name: KDD candidate checks
on:
  push:
    branches:
      - experiments/kdd-rt-i01-patrimonio-g2-20261028
      - experiments/kdd-android-transaction-g2-20261031
      - experiments/kdd-drive-ui-bridge-g2-20261031
      - experiments/kdd-economic-context-g2-20261102
  pull_request:
    branches:
      - main
      - governance/kdd-29-checklist-gate-20261102
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Core KDD regressions
        run: python -B -m unittest -q test_decision_desk
      - name: Private packet, market age and portfolio 4TF synthetic tests
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_android_transaction_g2 test_kdd_economics test_kdd_futures_flow test_kdd_network_defi
      - name: Drive UI handoff through the genuine bridge (no remote API)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_drive_exchange
      - name: Unchanged R5 invariant tests against Android candidate (mapped, no skips)
        run: PYTHONPATH=.:scripts python -B scripts/kdd_android_regressions.py
      - name: Public Kraken order-book funding scenarios (separate from Termux packaging fixture)
        run: PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_funding_book_g2
      - name: Existing safe updater tests
        run: python -B scripts/test_kdd_aggiorna.py
      - name: KDD-17 TEMPORARY second public RPC capability probe
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
        continue-on-error: true
        timeout-minutes: 3
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json, time, datetime as dt
          import kdd_network_defi as net, kdd_capital_flow as cap
          reqs=[];MAX=18
          def fetch(url,payload=None):
              if len(reqs)>=MAX:raise RuntimeError("public request budget exhausted")
              t=time.monotonic()
              try:
                  out=net._http(url,payload)
                  reqs.append({"host":url.split("/")[2],"method":payload.get("method") if isinstance(payload,dict) else "GET","ms":round((time.monotonic()-t)*1000),"status":"OK"})
                  return out
              except Exception as e:
                  reqs.append({"host":url.split("/")[2],"method":payload.get("method") if isinstance(payload,dict) else "GET","ms":round((time.monotonic()-t)*1000),"status":type(e).__name__,"code":getattr(e,"code",None)})
                  raise
          mint="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          contract="0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
          now=dt.datetime.now(dt.timezone.utc)
          results={}
          def attempt(name, fn):
              t=time.monotonic()
              try:
                  x=fn()
                  results[name]={"status":"OK","elapsed_ms":round((time.monotonic()-t)*1000),
                    "events":len(x.get("eventi",[])) if isinstance(x,dict) else None,
                    "holders":len(x.get("detentori",[])) if isinstance(x,dict) else None,
                    "first_event": {k:x["eventi"][0].get(k) for k in ("tx","quantita","tipo","rete","orario_utc","fonte")}
                                   if isinstance(x,dict) and x.get("eventi") else None,
                    "fields":list(x)[:15] if isinstance(x,dict) else None}
                  return x
              except Exception as e:
                  results[name]={"status":"UNAVAILABLE","error":type(e).__name__+":"+str(e)[:110],"elapsed_ms":round((time.monotonic()-t)*1000)}
                  return None
          head=attempt("ethereum_native_head",lambda:net._native_observe("ethereum",fetch,now))
          if head and head.get("stato")=="OSSERVATO":
              attempt("ethereum_ERC20_full_probe",lambda:cap._evm_token(
                  "ethereum",contract,net.NATIVE_ENDPOINTS["ethereum"],fetch,
                  {"valori":head["valori"]},{}))
          for name,url in [("rpcnode_solana","https://public-solana-mainnet.rpcnode.dev"),
                           ("publicnode_solana","https://solana-rpc.publicnode.com")]:
              attempt(name,lambda url=url: cap._rpc(fetch,url,"getTokenLargestAccounts",
                      [mint,{"commitment":"finalized"}]))
          b=attempt("near_final_block",lambda:cap._rpc(fetch,net.NATIVE_ENDPOINTS["near"],
                                "block",{"finality":"final"}))
          if isinstance(b,dict):
              chunks=b.get("chunks",[])
              results["near_chunks"]={"count":len(chunks),"first_tx_root":chunks[0].get("tx_root") if chunks else None,
                                     "non_empty":sum(1 for c in chunks if c.get("tx_root") not in (None,"11111111111111111111111111111111"))}
          attempt("xrpl_event_sample",lambda:cap._xrpl(net.NATIVE_ENDPOINTS["xrpl"],fetch))
          attempt("sui_event_sample",lambda:cap._sui(net.SUI_URL,fetch))
          print("KDD17_REAL_PROBE2",json.dumps({"results":results,"requests":reqs,"count":len(reqs)},ensure_ascii=False),flush=True)
          PY

  r5-historical-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc2306fd118024c9bdeb7908d85360c3fc578943
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: R5 ORIGINAL unmodified historical regression suite (NOT Android claims)
        run: |
          python -B -m unittest -q test_decision_desk
          PYTHONPATH=.:scripts python -B -m unittest -q scripts.test_kdd_wallet_packet_g0 scripts.test_kdd_market_freshness scripts.test_kdd_portfolio_4tf scripts.test_kdd_bridge_g2
          python -B scripts/test_kdd_aggiorna.py

  android-transaction-focused:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: G2 Android transaction independent discriminators (Linux synthetic)
        run: PYTHONPATH=.:scripts python -B -m unittest -v scripts.test_kdd_android_transaction_g2

  roadmap-contract:
    name: roadmap-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate all 29 identities and status/checkbox consistency
        run: python -B scripts/check_roadmap_contract.py
      - name: Validate actual PR diff, mandate, evidence and matching roadmap rows
        env:
          KDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KDD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KDD_PR_BODY: ${{ github.event.pull_request.body }}
          KDD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -B scripts/check_roadmap_contract.py --check-pr
      - name: Positive and adversarial guard tests
        run: python -B -m unittest -q scripts.test_roadmap_contract
