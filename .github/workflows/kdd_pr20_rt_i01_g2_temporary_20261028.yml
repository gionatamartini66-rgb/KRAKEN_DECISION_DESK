name: KDD RT-I01 temporary G2 regression check
on:
  push:
    branches:
      - experiments/kdd-pr20-rt-i01-g2-20261028
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile sources
        run: python -B -m py_compile decision_desk.py serve.py grafico_4h.py test_decision_desk.py
      - name: Full canonical suite
        run: python -B -m unittest -v test_decision_desk
      - name: Existing updater suite
        run: python -B scripts/test_kdd_aggiorna.py
      - name: Distinct mixed patrimonial and Spot HTTP fixture
        run: |
          python -B - <<'PY'
          import datetime as dt, html, http.client, json, pathlib, tempfile, threading
          from http.server import ThreadingHTTPServer
          from unittest import mock
          import decision_desk as desk, piano_gpt, verifica_piani, serve
          now=dt.datetime.now(dt.timezone.utc)
          ts=now.isoformat()
          def market(token,price):
              return {'token':token,'prezzo_eur':price,'var_oggi_utc_pct':None,
                      'volume_24h_eur_stimato':10000.0,'spread_pct':0.2}
          snapshot={'rilevazione_utc':ts,'markets':{'BTC':market('BTC',100.0)},
                    'trends':{},'feed':[],'problemi_feed':[],
                    'schede_v02':[{'token':'ADA','coppia_analisi':'ADA/USDT',
                        'categoria':'fittizio','esito':'RIESAME',
                        'alternative':[{'pair':'ADA/USDT','pair_key':'ADAUSDT'}]}]}
          portfolio={'posizioni':[{'token':'BTC','quantita':2,'costo_medio_eur':None},
                                  {'token':'SOL','quantita':None,'costo_medio_eur':None},
                                  {'token':'ETH','quantita':3,'costo_medio_eur':None}]}
          report=desk.build_report(snapshot,portfolio,{}, {}, [])
          assert [x['token'] for x in report['posizioni']]==['BTC','SOL','ETH']
          assert report['totale_stimato_eur']==200.0
          assert report['totale_parziale'] and report['posizioni_non_aggiornate']==1
          assert 'valore_eur' not in report['posizioni'][1]
          assert 'valore_eur' not in report['posizioni'][2]
          html_report=desk.render(report)
          for value in ['Quantità: non disponibile','Quantità: 3',
                        'Valore EUR non stimato','(incompleto)','200,00']:
              assert value in html_report,value
          assert 'Quantità 0' not in html_report
          original_dir,original_port=desk.DIR,serve.PORT
          with tempfile.TemporaryDirectory(prefix='rt-i01-isolated-') as tmp:
              desk.DIR=pathlib.Path(tmp)
              (desk.DIR/'cruscotto.html').write_text(html_report,encoding='utf-8')
              (desk.DIR/'ultima_rilevazione.json').write_text(json.dumps(snapshot),encoding='utf-8')
              pairs={'ADAUSDT':{'wsname':'ADA/USDT','status':'online'}}
              def feed(endpoint,**kw):
                  if endpoint=='AssetPairs':return pairs
                  assert endpoint=='OHLC' and kw.get('pair')=='ADAUSDT',(endpoint,kw)
                  interval=kw['interval']*60
                  base=(int(now.timestamp())//interval)*interval
                  rows=[]
                  for i in range(81):
                      p=1+i/1000
                      rows.append([base-(80-i)*interval,str(p),str(p+.02),
                                  str(p-.02),str(p),'0','100',1])
                  return {'ADAUSDT':rows,'last':base}
              with mock.patch.object(desk,'kraken',side_effect=feed):
                  server=ThreadingHTTPServer(('127.0.0.1',0),serve.Handler)
                  serve.PORT=server.server_address[1]
                  t=threading.Thread(target=server.serve_forever,daemon=True);t.start()
                  def call(method,path,body=None,host=None):
                      connection=http.client.HTTPConnection('127.0.0.1',serve.PORT,timeout=10)
                      headers={'Host':host or f'127.0.0.1:{serve.PORT}'}
                      if body is not None:headers['Content-Type']='application/x-www-form-urlencoded'
                      connection.request(method,path,body,headers)
                      rsp=connection.getresponse()
                      out=(rsp.status,rsp.getheader('Location'),rsp.read().decode('utf-8'))
                      connection.close()
                      return out
                  try:
                      with mock.patch.object(serve,'start_refresh',side_effect=AssertionError('NO_REFRESH_ON_GET')):
                          status,_,page=call('GET','/')
                          assert status==200,(status,page[:80])
                          assert 'Quantità: non disponibile' in page
                          assert 'Quantità: 3' in page
                          assert page.index('BTC')<page.index('SOL')<page.index('ETH')
                          status,_,selector=call('GET','/mercati/spot')
                          assert status==200
                          assert 'ADA/USDT' in selector
                          assert 'href="/grafico/spot?pair=ADAUSDT&amp;tf=4h"' in selector
                          assert call('GET','/grafico/spot?pair=ADAUSDT&tf=4h')[0]==200
                          assert call('GET','/analisi/spot?pair=ADAUSDT')[0]==200
                          assert call('GET','/grafico/spot?pair=ADAUSDT&tf=bad')[0]==400
                          assert call('GET','/',host='example.org')[0]==403
                          assert call('POST','/aggiorna',body='token=wrong')[0]==403
                      with mock.patch.object(serve,'start_refresh',return_value=False) as start:
                          status,location,_=call('POST','/aggiorna',body='token='+serve.TOKEN)
                          assert status==303 and location=='/?esito=occupato'
                          start.assert_called_once()
                      print('RT_I01_G2_COMPOSITION_HTTP: PASS real report, 3 holdings, real Spot rendering, POST checks; no real data')
                  finally:
                      server.shutdown();server.server_close();t.join(timeout=5)
                      serve.PORT=original_port;desk.DIR=original_dir
          PY
