name: KDD RT2 0.5 percent threshold and DOM tests
on:
  push:
    branches: [experiments/kdd-any-spot-g2-20261024]
permissions:
  contents: read
jobs:
  rt2-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tool versions
        run: |
          python --version
          node --version
      - name: RT2 exact threshold and DOM tests
        run: |
          python -B -m unittest -v \
            test_decision_desk.AnyKrakenSpotTests.test_r6_rt2_inclusive_exact_point_five_percent_in_generated_dom \
            test_decision_desk.AnyKrakenSpotTests.test_r6_rt2_inclusive_subnormal_point_five_percent_in_generated_dom \
            test_decision_desk.AnyKrakenSpotTests.test_r6_rt2_more_than_two_confluences_are_explicitly_disclosed
      - name: Full canonical unit tests
        run: python -B -m unittest -v test_decision_desk
      - name: Public preflight and preview suites
        run: |
          python -B scripts/test_kdd_pr20_preflight_g0.py
          python -B scripts/test_kdd_pr20_preview_g0.py
      - name: Compile
        run: python -B -m py_compile grafico_4h.py serve.py test_decision_desk.py
