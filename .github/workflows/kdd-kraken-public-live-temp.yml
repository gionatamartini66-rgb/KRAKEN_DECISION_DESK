name: KDD G0 live Kraken public response verification - temporary
on:
  push:
    branches: [experiments/kdd-any-spot-g2-20261024]
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Official public Kraken AssetPairs and OHLC smoke - NO private endpoints
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import time
          import urllib.parse
          import urllib.request
          
          import serve
          import grafico_4h as g
          
          BASE = "https://api.kraken.com/0/public/"
          def fetch(endpoint, **kwargs):
              if endpoint not in ("AssetPairs", "OHLC"):
                  raise AssertionError("Non-public request forbidden")
              q = urllib.parse.urlencode(kwargs)
              url = BASE + endpoint + ("?" + q if q else "")
              req = urllib.request.Request(url, headers={"User-Agent": "KDD-spot-G0-public-check/1.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  obj = json.load(response)
              if obj.get("error") or not isinstance(obj.get("result"), dict):
                  raise RuntimeError("Public Kraken API error: " + str(obj.get("error")))
              return obj["result"]
          
          pairs = fetch("AssetPairs")
          count = len(pairs)
          catalog = serve.spot_catalog(lambda endpoint, **kw: pairs)
          names = {m["pair"]:m for m in catalog.values()}
          print("PUBLIC_ONLY_ASSETPAIRS", count, "ONLINE_VALID", len(catalog), flush=True)
          
          selected = ["XBT/EUR", "ETH/USD", "ADA/USDT"]
          missing = [name for name in selected if name not in names]
          if missing:
              raise AssertionError("Expected online pair unavailable: " + ",".join(missing))
          
          def via_cache(endpoint, **kwargs):
              if endpoint == "AssetPairs":
                  return pairs
              return fetch(endpoint, **kwargs)
          
          for name in selected:
              m = names[name]
              series = fetch("OHLC", pair=m["pair_key"], interval=240)
              key = [k for k in series if k!="last"]
              print("PAIR_RAW", name, "assetpairs_key",m["pair_key"],"altname",m["altname"],
                    "ohlc_return",key,flush=True)
              checked = serve.checked_spot_ohlc(series, m)
              graph = g.data_from_kraken_ohlc(checked,"4h",now=dt.datetime.now(dt.timezone.utc),
                               pair=m["pair"],token=m["base"],pair_key=m["pair_key"])
              assert graph["pair"]==name and graph["pair_key"]==m["pair_key"]
              assert len(graph["candles"])>=30
              assert graph["candles"][-1]["time"] < time.time()
              page = g.page_from_data(graph)
              assert ("Grafico "+name) in page
              assert "SUI/EUR" not in page
              print("PAIR_PASS",name,"closed",len(graph["candles"]),
                    "last_closed",graph["closed_at_utc"],flush=True)
              time.sleep(1.0)
          
          m=names["XBT/EUR"]
          report=serve.load_spot_comparison(m["pair_key"],public_kraken=via_cache)
          print("FOUR_FRAMES", report["coppia"], report["stato"],
                [(x["timeframe"],x["stato"]) for x in report["timeframe"]],flush=True)
          assert report["coppia"]=="XBT/EUR"
          assert report["stato"]=="COMPLETO", "Real comparison incomplete - investigate rather than weaken"
          print("LIVE_KRAKEN_PUBLIC_SMOKE_PASS", flush=True)
          PY
