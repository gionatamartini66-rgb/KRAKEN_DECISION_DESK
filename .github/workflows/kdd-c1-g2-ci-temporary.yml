# TEMPORANEO — solo ramo riconciliato C1/G2; vietati merge e deploy.
name: KDD C1 + G2 reconciled CI (temporaneo)
on:
  push:
    branches:
      - experiments/kdd-c1-g2-reconciled-20261024
    paths:
      - .github/workflows/kdd-g2-ci-temporary.yml
permissions:
  contents: read
concurrency:
  group: kdd-c1-g2-ci-temp
  cancel-in-progress: false
jobs:
  test-senza-dati-privati:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout isolato senza credenziali persistenti
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Identita commit e assenza di file riservati
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for file in config.json portafoglio.json piano_gpt.json migrazione_attesa.json; do
            test ! -e "$file"
          done
          test ! -d storico_portafoglio
          echo "G2 TEST: checkout senza dati patrimoniali"
      - name: Compilazione sorgenti
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q analisi_v02.py binance_reference.py costi_spot.py decision_desk.py dossier_trade.py flusso_spot.py grafico_4h.py kdd_saldi.py kraken_readonly.py mercati_spot.py piano_gpt.py ricerca_setup.py serve.py studio_delta.py test_decision_desk.py verifica_piani.py
      - name: Esecuzione integrale della suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -q test_decision_desk
      - name: Test locale sintetico T0, compreso tentativo di falsificazione
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import contextlib
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import tempfile
          from unittest.mock import patch
          import decision_desk as d
          import test_decision_desk as tests

          def write_json(path, obj):
              path.write_text(json.dumps(obj, sort_keys=True), encoding='utf-8')

          with tempfile.TemporaryDirectory(prefix='kdd-t0-synth-') as directory:
              root = Path(directory)
              (root / 'config.json').write_text('{}', encoding='utf-8')
              folder = root / 'storico_portafoglio'
              folder.mkdir()
              name = 'T0_2025-01-02_1234_KRAKEN_PRO'
              original = folder / (name + '.json')
              snapshot = {
                  'valore_totale_fotografia_eur': '3.00',
                  'quantita_e_valori_schermata': [
                      {'valore_eur_visualizzato': '0.99'},
                      {'valore_eur_visualizzato': '2.00'}
                  ]
              }
              write_json(original, snapshot)
              original_sha = hashlib.sha256(original.read_bytes()).hexdigest()
              portafoglio = root / 'portafoglio.json'
              state = {
                  't0_id': name,
                  't0_sha256': original_sha,
                  'fonte_quantita': 'Kraken BalanceEx',
                  'posizioni': [],
                  'liquidita_spot_api': {}
              }
              write_json(portafoglio, state)
              test = tests.DeskTests('test_local_t0_original_integrity_and_balances_are_separate')
              proof = hashlib.sha256(
                  ('KDD-T0-20261024-VERIFICA-RETROSPETTIVA:' + original_sha).encode()
              ).hexdigest()[:24]
              with patch.object(d, 'DIR', root), patch.dict(os.environ, {'KDD_T0_TRUSTED_PROOF': proof}, clear=True):
                  test.test_local_t0_original_integrity_and_balances_are_separate()
                  snapshot['quantita_e_valori_schermata'][0]['valore_eur_visualizzato'] = '1.50'
                  snapshot['quantita_e_valori_schermata'][1]['valore_eur_visualizzato'] = '1.47'
                  write_json(original, snapshot)
                  state['t0_sha256'] = hashlib.sha256(original.read_bytes()).hexdigest()
                  write_json(portafoglio, state)
                  try:
                      test.test_local_t0_original_integrity_and_balances_are_separate()
                  except AssertionError:
                      pass
                  else:
                      raise AssertionError('T0 falsificato e impronta locale alterata non riconosciuti')
                  # Con una NUOVA impronta sintetica coerente, l'errore
                  # aritmetico di tre centesimi deve restare riconoscibile.
                  altered_proof = hashlib.sha256(
                      ('KDD-T0-20261024-VERIFICA-RETROSPETTIVA:' + state['t0_sha256']).encode()
                  ).hexdigest()[:24]
                  with patch.dict(os.environ, {'KDD_T0_TRUSTED_PROOF': altered_proof}, clear=True):
                      try:
                          test.test_local_t0_original_integrity_and_balances_are_separate()
                      except AssertionError:
                          pass
                      else:
                          raise AssertionError('T0 sintetico incoerente di tre centesimi non riconosciuto')
              print('T0 sintetico: scarto di un centesimo ammesso; falsificazione e scarto eccessivo rifiutati')
          PY
