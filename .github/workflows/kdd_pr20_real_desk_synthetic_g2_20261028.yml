name: KDD real patrimonial home synthetic G2
on:
  push:
    branches: [experiments/kdd-pr20-main-integration-g2-20261027]
permissions:
  contents: read
jobs:
  real-home:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Actual KDD report rendering and integrated HTTP navigation on synthetic fixtures
        run: |
          python -B - <<'PY'
          import datetime as dt
          import http.client, json, pathlib, shutil, tempfile, threading
          from http.server import ThreadingHTTPServer
          from unittest import mock
          import decision_desk as desk
          import piano_gpt as plans
          import verifica_piani as histories
          import serve
          from test_decision_desk import DeskTests, AnyKrakenSpotTests, fixture_trade_plan
          
          case=DeskTests("test_screening_and_html")
          case.setUp()
          now=dt.datetime.now(dt.timezone.utc)
          stamp=now.isoformat()
          markets=desk.market_pairs_and_ticker(case.pairs,case.t)
          assert "BTC" in markets and "SOL" in markets
          spotcase=AnyKrakenSpotTests("test_market_catalog_includes_non_eur_and_does_not_force_sui")
          spotcase.setUp()
          spotcase.now=now
          shortlist={"token":"ADA","coppia_analisi":"ADA/USDT",
           "categoria":"consolidamento","esito":"RIESAME MIRATO",
           "sintesi":"Simulazione: ricontrollare le chiusure.",
           "perche_selezionato":"Caso fittizio selezionato da KDD",
           "alternative":[{"pair":"ADA/USDT","pair_key":"ADAUSDT",
                           "volume_eur_stimato":1000000.0,"spread_pct":0.2}]}
          snapshot={"rilevazione_utc":stamp,
           "markets":markets,"trends":{},"feed":[],"problemi_feed":[],
           "schede_v02":[shortlist],"n_token_multi":3,"n_coppie_multi":3}
          portfolio={"posizioni":[
           {"token":"BTC","quantita":0.002,"costo_medio_eur":None},
           {"token":"SOL","quantita":3.25,"costo_medio_eur":None}],
           "fonte_quantita":"SINTETICA - NON BALANCEEX"}
          report=desk.build_report(snapshot,portfolio,{}, {}, [])
          plan=plans.validate(fixture_trade_plan())
          report["piano_gpt"]=plan
          report["verifica_piano"]={"hash_piano":histories.plan_hash(plan),
           "stato":"PROVVISORIO","ordine_eventi":"NESSUNO_DEI_DUE_OSSERVATO",
           "copertura_completa":False,"ottenute":0,"attese":8}
          report["verifica_storico"]={"piani":[{
           "hash_piano":"0"*64,"coppia":"ABC/EUR",
           "creato_utc":"2026-10-16T10:00:00+00:00","tracking":"LACUNA"}]}
          actual_html=desk.render(report)
          for marker in ("PRIMA LETTURA · PIANO GPT","Che cosa è successo dopo il piano?",
           "Archivio: 1 piani precedenti conservati","Decisioni e posizioni",
           "Quantità 0.002","Quantità 3.25",
           "Candidati da valutare","Simulazione: ricontrollare le chiusure."):
           assert marker in actual_html,("DESK_RENDER",marker)
          assert actual_html.index("PRIMA LETTURA · PIANO GPT") < actual_html.index("1 · Decisioni e posizioni")
          original_dir=desk.DIR
          with tempfile.TemporaryDirectory(prefix="kdd-real-home-fake-") as folder:
           desk.DIR=pathlib.Path(folder)
           (desk.DIR/"vendor").mkdir()
           src=original_dir/"vendor"/"lightweight-charts-5.2.1.js"
           assert src.is_file(),"Missing canonical vendor library"
           shutil.copy2(src,desk.DIR/"vendor"/src.name)
           (desk.DIR/"cruscotto.html").write_text(actual_html,encoding="utf-8")
           (desk.DIR/"ultima_rilevazione.json").write_text(json.dumps(snapshot),encoding="utf-8")
           def request_http(method,path,body=None,host="127.0.0.1:8765"):
            c=http.client.HTTPConnection("127.0.0.1",8765,timeout=12)
            headers={"Host":host}
            if body is not None: headers["Content-Type"]="application/x-www-form-urlencoded"
            c.request(method,path,body=body,headers=headers)
            response=c.getresponse()
            outcome=(response.status,response.getheader("Location"),response.read().decode("utf-8",errors="replace"))
            c.close()
            return outcome
           with mock.patch.object(desk,"kraken",side_effect=spotcase.fake):
            server=ThreadingHTTPServer(("127.0.0.1",8765),serve.Handler)
            worker=threading.Thread(target=server.serve_forever,daemon=True)
            worker.start()
            try:
             status,_,page=request_http("GET","/")
             assert status==200,status
             for marker in ("PRIMA LETTURA · PIANO GPT","Che cosa è successo dopo il piano?",
                "Archivio: 1 piani precedenti conservati",
                "Quantità 0.002","Quantità 3.25",
                "Case","href='/mercati/spot'","action='/aggiorna'"):
              if marker=="Case": continue
              assert marker in page,("REAL_HOME",marker)
             assert page.index("PRIMA LETTURA · PIANO GPT") < page.index("1 · Decisioni e posizioni")
             assert page.count("action='/aggiorna'")==1
             assert "Questa copia HTML è una fotografia" not in page
             print("REAL_KDD_HOME: PASS actual build_report -> render -> HTTP, fake wallet/plan/archive preserved")
             status,_,selector=request_http("GET","/mercati/spot")
             assert status==200,(status,selector[:90])
             for marker in ("Questa sezione appartiene al KDD patrimoniale originale.",
                 "Caso fittizio selezionato da KDD",
                 'href="/grafico/spot?pair=ADAUSDT&amp;tf=4h"',
                 'href="/analisi/spot?pair=ADAUSDT"',
                 'href="/"'):
              assert marker in selector,("SPOT_SELECTOR",marker)
             status,_,chart=request_http("GET","/grafico/spot?pair=ADAUSDT&tf=4h")
             assert status==200,(status,chart[:120])
             for marker in ("Grafico ADA/USDT · 4H","Volumi scambiati (ADA)",
                'href="/analisi/spot?pair=ADAUSDT"',
                'pair=ADAUSDT&amp;tf=15m'):
              assert marker in chart,("ACTUAL_CHART",marker)
             status,_,compare=request_http("GET","/analisi/spot?pair=ADAUSDT")
             assert status==200,(status,compare[:120])
             for marker in ("Confronto ADA/USDT","15m","1H","4H","1D",
                 "pair=ADAUSDT&amp;tf=4h"):
              assert marker in compare,("ACTUAL_COMPARISON",marker)
             assert request_http("GET","/grafico/spot?pair=ADAUSDT&tf=invalid")[0]==400
             assert request_http("GET","/",host="invalid.example")[0]==403
             with mock.patch.object(serve,"start_refresh",side_effect=AssertionError("REFRESH_FORBIDDEN")):
              assert request_http("POST","/aggiorna",body="token=WRONG")[0]==403
             with mock.patch.object(serve,"start_refresh",return_value=False) as guarded:
              status,location,_=request_http("POST","/aggiorna",body="token="+serve.TOKEN)
              assert status==303 and location=="/?esito=occupato",(status,location)
              guarded.assert_called_once()
             print("REAL_KDD_NAVIGATION: PASS shortlist -> actual chart -> actual 4TF comparison; return-home and POST guard; no Kraken network")
            finally:
             server.shutdown();server.server_close();worker.join(timeout=5)
             desk.DIR=original_dir
          
          PY
