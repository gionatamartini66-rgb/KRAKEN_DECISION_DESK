name: KDD PR20 confluence G2 isolated tests
on:
  push:
    branches:
      - experiments/kdd-any-spot-g2-20261024
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tools
        run: |
          python --version
          node --version
      - name: Confluence real generated DOM tests
        run: |
          python -B -m unittest -v \
            test_decision_desk.AnyKrakenSpotTests.test_r4_confluence_real_dom_negative_and_opposite_signs \
            test_decision_desk.AnyKrakenSpotTests.test_r4_confluence_real_dom_positive_threshold_and_overflow
      - name: Canonical test suite (two private Samsung checks may skip)
        run: python -B -m unittest -v test_decision_desk
      - name: G0 preflight and preview synthetic suites
        run: |
          python -B scripts/test_kdd_pr20_preflight_g0.py
          python -B scripts/test_kdd_pr20_preview_g0.py
      - name: Source compile
        run: python -B -m py_compile grafico_4h.py serve.py test_decision_desk.py
