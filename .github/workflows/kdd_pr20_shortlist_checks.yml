name: KDD PR20 shortlist checks (temporary)
on:
  push:
    branches: [experiments/kdd-any-spot-g2-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile relevant sources
        run: python -m py_compile serve.py grafico_4h.py test_decision_desk.py scripts/kdd_pr20_preview_samsung_g0.py scripts/test_kdd_pr20_preview_g0.py scripts/kdd_pr20_preflight_g0_20261025.py scripts/test_kdd_pr20_preflight_g0.py
      - name: Canonical regressions (private phone tests skipped here)
        run: python -m unittest -q test_decision_desk
      - name: Synthetic preview regressions
        run: python scripts/test_kdd_pr20_preview_g0.py
      - name: Synthetic preflight regressions
        run: python scripts/test_kdd_pr20_preflight_g0.py
