name: KDD isolated Chrome browser smoke - temporary
on:
  push:
    branches: [experiments/kdd-any-spot-g2-20261024]
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Detect chrome and driver
        run: |
          google-chrome --version
          python -m pip install --disable-pip-version-check selenium==4.38.0
      - name: Navigate searchable catalog and render actual chart in headless Chrome
        run: |
          python - <<'PY'
          import datetime as dt
          import socket
          import threading
          import time
          from pathlib import Path
          from http.server import ThreadingHTTPServer
          from unittest import mock
          
          import serve
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.select import Select
          from selenium.webdriver.support.ui import WebDriverWait
          
          pairs = {
              "XXBTZEUR":{"wsname":"XBT/EUR","status":"online","altname":"XBTEUR"},
              "ADAUSDT":{"wsname":"ADA/USDT","status":"online","altname":"ADAUSDT"},
              "SUITEST":{"wsname":"SUI/EUR","status":"online","altname":"SUIEUR"}
          }
          
          def provider(endpoint, **params):
              if endpoint == "AssetPairs":
                  return pairs
              if endpoint != "OHLC":
                  raise AssertionError("Non-public Kraken endpoint invoked")
              interval=params["interval"]*60
              now=int(time.time())
              start=(now//interval)*interval
              bars=[]
              for i in range(81):
                  t=start-(80-i)*interval
                  p=100+i/100
                  bars.append([t,str(p),str(p+1),str(p-1),str(p),"0","234",2])
              return {params["pair"]:bars,"last":start}
          
          opts=webdriver.ChromeOptions()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=390,844")
          opts.add_argument("--no-first-run")
          opts.add_argument("--no-default-browser-check")
          driver=None
          srv=ThreadingHTTPServer(("127.0.0.1",0),serve.Handler)
          srv.daemon_threads=True
          port=srv.server_address[1]
          runner=threading.Thread(target=srv.serve_forever, daemon=True)
          with mock.patch.object(serve,"PORT",port), mock.patch.object(serve.desk,"DIR",Path.cwd()), mock.patch.object(serve.desk,"kraken",side_effect=provider):
              runner.start()
              try:
                  driver=webdriver.Chrome(options=opts)
                  driver.set_page_load_timeout(22)
                  base="http://127.0.0.1:"+str(port)
                  driver.get(base+"/mercati/spot")
                  assert "Mercati Kraken Spot" in driver.page_source
                  select=driver.find_element(By.ID,"pair")
                  assert select.get_attribute("value")=="" 
                  driver.find_element(By.ID,"filtro").send_keys("BTC")
                  WebDriverWait(driver,10).until(lambda x: "XBT/EUR" in x.find_element(By.ID,"pair").text)
                  assert "ADA/USDT" not in driver.find_element(By.ID,"pair").text
                  Select(driver.find_element(By.ID,"pair")).select_by_value("XXBTZEUR")
                  driver.find_element(By.CSS_SELECTOR,"button[formaction='/grafico/spot']").click()
                  WebDriverWait(driver,15).until(lambda x: "Grafico XBT/EUR" in x.find_element(By.TAG_NAME,"h1").text)
                  assert "pair=XXBTZEUR" in driver.page_source
                  WebDriverWait(driver,20).until(lambda x: "Grafico generato:" in x.find_element(By.ID,"msg").text)
                  print("CHROME_BROWSER_CHART_PASS",driver.find_element(By.TAG_NAME,"h1").text,flush=True)
                  driver.get(base+"/mercati/spot")
                  Select(driver.find_element(By.ID,"pair")).select_by_value("ADAUSDT")
                  driver.find_element(By.CSS_SELECTOR,"button[type='submit']:not([formaction])").click()
                  WebDriverWait(driver,18).until(lambda x: "Confronto ADA/USDT" in x.find_element(By.TAG_NAME,"h1").text)
                  assert "PARZIALE" not in driver.find_element(By.TAG_NAME,"body").text
                  print("CHROME_BROWSER_MTF_PASS",driver.find_element(By.TAG_NAME,"h1").text,flush=True)
                  assert driver.execute_script("return document.documentElement.scrollWidth <= window.innerWidth + 2")
                  print("CHROME_MOBILE_VIEWPORT_PASS",flush=True)
              finally:
                  if driver: driver.quit()
                  srv.shutdown()
                  srv.server_close()
                  runner.join(timeout=3)
          PY
