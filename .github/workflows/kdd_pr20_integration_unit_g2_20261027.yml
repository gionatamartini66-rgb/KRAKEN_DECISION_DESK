name: KDD PR20 main-derived candidate unit check
on:
  push:
    branches:
      - experiments/kdd-pr20-main-integration-g2-20261027
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Canonical KDD unit suite
        run: python -B -m unittest -q test_decision_desk
      - name: Compile reconciled sources
        run: python -B -m py_compile serve.py grafico_4h.py test_decision_desk.py
